version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pg-health-backend
    ports:
      - "3000:3000"
    volumes:
      - .:/app                      # Пробрасываем всю папку бэкенда для hot‑reload
      - /app/node_modules           # Исключаем node_modules внутри контейнера
    environment:
      - NODE_ENV=development
    env_file:
      - .env                        # Передаём переменные окружения из корневого .env
    networks:
      - app-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pg-health-frontend
    ports:
      - "3001:3001"
    volumes:
      - ./client:/app               # Hot‑reload фронтенда
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge